{#- Shared <head> metadata for search engines and social previews.
    Expects the values produced by seo() in app.py: seo_title,
    seo_description, seo_canonical, seo_image, seo_type, article_published.
-#}
<meta charset="utf-8" />
<title>{{ seo_title }}</title>
<meta name="description" content="{{ seo_description }}" />
<meta name="author" content="{{ site_author }}" />
<link rel="canonical" href="{{ seo_canonical }}" />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#14181f" />

<!-- Open Graph -->
<meta property="og:site_name" content="{{ site_name }}" />
<meta property="og:type" content="{{ seo_type }}" />
<meta property="og:title" content="{{ seo_title }}" />
<meta property="og:description" content="{{ seo_description }}" />
<meta property="og:url" content="{{ seo_canonical }}" />
<meta property="og:image" content="{{ seo_image }}" />
<meta property="og:image:alt" content="{{ seo_title }}" />
<meta property="og:locale" content="en_US" />
{% if article_published %}
<meta property="article:published_time" content="{{ article_published }}" />
<meta property="article:author" content="{{ site_author }}" />
{% endif %}

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{ seo_title }}" />
<meta name="twitter:description" content="{{ seo_description }}" />
<meta name="twitter:image" content="{{ seo_image }}" />
{% if twitter_handle %}
<meta name="twitter:creator" content="@{{ twitter_handle }}" />
<meta name="twitter:site" content="@{{ twitter_handle }}" />
{% endif %}

<!-- Icons -->
<link rel="apple-touch-icon" sizes="180x180"
      href="{{ url_for('static', filename='dist/assets/img/apple-touch-icon.png') }}" />
<link rel="icon" type="image/png"
      href="{{ url_for('static', filename='dist/assets/img/favicon.png') }}" />

<!-- Structured data -->
<script type="application/ld+json">
{% if seo_type == 'article' %}
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ seo_title | tojson }},
  "description": {{ seo_description | tojson }},
  "url": {{ seo_canonical | tojson }},
  "image": {{ seo_image | tojson }},
  "datePublished": {{ article_published | tojson }},
  "author": { "@type": "Person", "name": {{ site_author | tojson }} },
  "publisher": { "@type": "Organization", "name": {{ site_name | tojson }} },
  "mainEntityOfPage": { "@type": "WebPage", "@id": {{ seo_canonical | tojson }} }
}
{% else %}
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site_name | tojson }},
  "url": {{ site_url | tojson }},
  "description": {{ default_description | tojson }},
  "author": { "@type": "Person", "name": {{ site_author | tojson }} }
}
{% endif %}
</script>
